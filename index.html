  <body>
    <script>
      // Apply theme before React renders to avoid a flash. Every device defaults
      // to light mode; the user's explicit choice in Settings persists and takes
      // precedence on return visits.
      (function () {
        try {
          var saved = localStorage.getItem("blockwork-theme");
          var theme = saved || "light";
          if (!saved) localStorage.setItem("blockwork-theme", theme);
          var root = document.documentElement;
          if (theme === "light") root.classList.add("force-light");
          else if (theme === "dark") root.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
